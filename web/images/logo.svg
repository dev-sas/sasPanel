<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 144" width="120" height="144" xml:space="preserve">
  <title>sasPanel Logo</title>
  <defs>
    <!-- Background / Ambient Glow Gradient -->
    <radialGradient id="sasGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#4facfe" stop-opacity="0" />
    </radialGradient>

    <!-- Gradient 1: Top Upper Arc (Electric Cyan to Blue) -->
    <linearGradient id="sasGradTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#0066ff" />
    </linearGradient>

    <!-- Gradient 2: Center Diagonal Sweep (Vibrant Blue to Purple/Magenta) -->
    <linearGradient id="sasGradMid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4facfe" />
      <stop offset="40%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Gradient 3: Lower Loop (Vibrant Indigo to Fuchsia) -->
    <linearGradient id="sasGradBottom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Gradient 4: Server Shield Accent -->
    <linearGradient id="sasGradAccent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00c6ff" />
      <stop offset="100%" stop-color="#0072ff" />
    </linearGradient>

    <!-- Filter for sleek soft shadow -->
    <filter id="sasShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.35" />
    </filter>

    <linearGradient id="sasGloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Ambient Glow Behind Icon -->
  <circle cx="60" cy="72" r="54" fill="url(#sasGlow)" />

  <g filter="url(#sasShadow)">
    <!-- Top Arc of 'S' with futuristic server wing -->
    <path d="M 88,26 C 72,12 40,12 28,25 C 16,38 18,54 36,63 L 74,80 C 92,88 95,108 82,122 C 68,136 38,136 24,122 C 18,116 14,108 12,100 L 26,96 C 28,103 32,111 40,117 C 50,125 70,125 78,114 C 86,103 82,91 68,84 L 32,68 C 12,58 8,36 22,20 C 38,2 74,2 96,20 Z" 
          fill="url(#sasGradMid)" />

    <!-- Top Gloss Wing overlay for depth -->
    <path d="M 96,20 C 74,2 38,2 22,20 C 8,36 12,58 32,68 L 54,78 C 50,70 46,56 46,44 C 46,30 58,18 78,18 C 86,18 92,20 96,20 Z" 
          fill="url(#sasGradTop)" />

    <!-- Bottom Dynamic Swoosh -->
    <path d="M 32,68 L 74,80 C 92,88 95,108 82,122 C 68,136 38,136 24,122 C 18,116 14,108 12,100 L 28,96 C 30,104 36,112 44,116 C 58,124 74,120 78,110 C 83,98 75,89 64,84 Z" 
          fill="url(#sasGradBottom)" />

    <!-- Sleek Center Server Node/Core Hex Elements -->
    <circle cx="34" cy="38" r="4.5" fill="#ffffff" />
    <circle cx="86" cy="106" r="4.5" fill="#ffffff" />
    
    <!-- Top Core Glow Highlight -->
    <path d="M 34,20 C 48,14 70,14 84,24 C 76,21 54,20 40,26 Z" fill="url(#sasGloss)" />
  </g>
</svg>